              </div>

              <button className="btn btn-teal" style={{ marginTop: 16 }} disabled={saving} onClick={save}>
                {saving ? <><Spinner /> Saving…</> : 'Save settings'}
              </button>
            </div>
          </div>

          <div className="form-col-side">
            <div className="card form-card">
              <CardHeader icon={<IconEye />} title="Invoice preview" hint="Live preview of your documents" />
              <ScaledSheet inv={sampleInvoice(form)} biz={form} />
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- Expenses page ---------------- */
    const EXPENSE_CATEGORIES = ['Office', 'Travel/Commute', 'Supplies', 'Utilities', 'Software', 'Marketing', 'Payroll', 'Other'];

    function ExpensesPage({ expenses, loading, onAdd, onDelete, showToast }) {
      const [date, setDate] = useState(todayLocalDate());
      const [category, setCategory] = useState('Office');
      const [description, setDescription] = useState('');
      const [amount, setAmount] = useState('');
      const [notes, setNotes] = useState('');
      const [saving, setSaving] = useState(false);
      const [query, setQuery] = useState('');
      const [deletingId, setDeletingId] = useState(null);

      const handleDelete = async (id) => {
        setDeletingId(id);
        await onDelete(id);
        setDeletingId(null);
      };

      const filtered = useMemo(() => {
        const q = query.toLowerCase();
        return expenses.filter((e) =>
          !q ||
          (e['Category'] || '').toLowerCase().includes(q) ||
          (e['Description'] || '').toLowerCase().includes(q) ||
          (e['Expense ID'] || '').toLowerCase().includes(q)
        );
      }, [expenses, query]);

      const total = useMemo(() => expenses.reduce((s, e) => s + (Number(e['Amount']) || 0), 0), [expenses]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!category.trim()) { showToast('Choose a category.', 'err'); return; }
        if (!description.trim()) { showToast('Enter a description.', 'err'); return; }
        const amt = parseFloat(amount);
        if (isNaN(amt) || amt <= 0) { showToast('Enter a valid amount.', 'err'); return; }
        setSaving(true);
        try {
          const res = await onAdd({ date, category, description, amount: amt, notes });
          if (res && res.success) {
            showToast('Expense saved as ' + res.expenseId, 'ok');
            setDescription(''); setAmount(''); setNotes('');
          } else {
            showToast((res && res.error) || 'Could not save expense.', 'err');
          }
        } catch (err) {
          showToast(err.message || 'Could not save expense.', 'err');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="form-layout">
          <div className="form-col-main">
            <div className="card">
              <div className="table-toolbar">
                <input className="search-input" placeholder="Search by description, category or ID…"
                  value={query} onChange={(e) => setQuery(e.target.value)} />
                <span className="mono" style={{ fontSize: 13, fontWeight: 600 }}>Total {fmt(total)}</span>
              </div>

              {loading ? (
                <LoadingState />
              ) : filtered.length === 0 ? (
                <div className="empty-state">
                  {expenses.length === 0
                    ? 'No expenses yet. Add your first one on the right.'
                    : 'No expenses match your search.'}
                </div>
              ) : (
                <table>
                  <thead>
                    <tr>
                      <th>Expense</th><th>Date</th><th>Category</th><th>Description</th>
                      <th style={{ textAlign: 'right' }}>Amount</th><th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.map((e) => (
                      <tr key={e['Expense ID']}>
                        <td className="mono" style={{ fontWeight: 600 }}>{e['Expense ID']}</td>
                        <td className="mono" style={{ color: 'var(--ink-soft)' }}>{fmtDate(e['Date'])}</td>
                        <td><span className="stamp" style={{ transform: 'none', textTransform: 'none', letterSpacing: '0.02em' }}>{e['Category'] || 'Other'}</span></td>
                        <td>
                          {e['Description']}
                          {e['Notes'] ? <div style={{ fontSize: 12, color: 'var(--ink-soft)' }}>{e['Notes']}</div> : null}
                        </td>
                        <td className="amount">{fmt(e['Amount'])}</td>
                        <td style={{ textAlign: 'right' }}>
                          <button className="btn btn-ghost btn-sm" disabled={deletingId === e['Expense ID']}
                            onClick={() => handleDelete(e['Expense ID'])}>
                            {deletingId === e['Expense ID'] ? <><Spinner small /> Deleting…</> : 'Delete'}
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>

          <div className="form-col-side">
            <div className="card form-card">
              <CardHeader icon={<IconReceipt />} title="Add expense" hint="Saves a row to your Expenses tab" />
              <form onSubmit={handleSubmit}>
                <div className="form-grid">
                  <div className="field"><label>Date</label><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div>
                  <div className="field">
                    <label>Category</label>
                    <select value={category} onChange={(e) => setCategory(e.target.value)}>
                      {EXPENSE_CATEGORIES.map((c) => <option key={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
                <div className="field"><label>Description *</label><input value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What was it for?" /></div>
                <div className="field"><label>Amount *</label><input type="number" min="0" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" /></div>
                <div className="field"><label>Notes</label><textarea className="notes-input" rows="2" value={notes} onChange={(e) => setNotes(e.target.value)} /></div>
                <button className="btn btn-teal" style={{ width: '100%', marginTop: 8 }} disabled={saving} type="submit">
                  {saving ? <><Spinner /> Saving…</> : 'Add expense'}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- App shell ---------------- */
    function App() {
      const [page, setPage] = useState('dashboard');
      const [invoices, setInvoices] = useState([]);
      const [loading, setLoading] = useState(true);
      const [expenses, setExpenses] = useState([]);
      const [expensesLoading, setExpensesLoading] = useState(true);
      const [toast, setToast] = useState(null);
      const [settings, setSettings] = useState(null);
      const [previewMode, setPreviewMode] = useState(false);
      const [dataInfo, setDataInfo] = useState(null);

      const showToast = (msg, kind) => {
        setToast({ msg, kind });
        setTimeout(() => setToast(null), 3500);
      };

      const loadSettings = useCallback(() => {
        gasCall('getSettings')
          .then((s) => { applySettings(s); setSettings(s); setPreviewMode(PREVIEW_MODE); })
          .catch((err) => { setPreviewMode(PREVIEW_MODE); console.error(err); });
      }, []);

      const refresh = useCallback(() => {
        setLoading(true);
        gasCall('getAllInvoices')
          .then((raw) => {
            let data = [];
            try { data = JSON.parse(raw) || []; } catch (e) { data = []; }
            setInvoices(data);
            setLoading(false);
            setPreviewMode(PREVIEW_MODE);
            if (!(data && data.length)) {
              gasCall('getDataInfo').then(setDataInfo).catch(() => { });
            }
          })
          .catch((err) => { showToast(err.message || 'Could not load invoices.', 'err'); setLoading(false); setPreviewMode(PREVIEW_MODE); });
      }, []);

      const refreshExpenses = useCallback(() => {
        setExpensesLoading(true);
        gasCall('getAllExpenses')
          .then((raw) => {
            let data = [];
            try { data = JSON.parse(raw) || []; } catch (e) { data = []; }
            setExpenses(data);
            setExpensesLoading(false);
          })
          .catch((err) => { showToast(err.message || 'Could not load expenses.', 'err'); setExpensesLoading(false); });
      }, []);

      useEffect(() => { loadSettings(); refresh(); refreshExpenses(); }, [loadSettings, refresh, refreshExpenses]);

      const handleMarkPaid = async (invoiceId) => {
        try {
          const res = await gasCall('updateInvoiceStatus', invoiceId, 'Paid');
          if (res.success) { showToast(invoiceId + ' marked as paid', 'ok'); refresh(); return true; }
          showToast(res.error || 'Could not update invoice.', 'err');
        } catch (err) { showToast(err.message || 'Could not update invoice.', 'err'); }
        return false;
      };

      const handleAddExpense = async (data) => {
        try {
          const res = await gasCall('saveExpense', data);
          if (res && res.success) refreshExpenses();
          return res;
        } catch (err) {
          return { success: false, error: err.message || 'Could not save expense.' };
        }
      };

      const handleDeleteExpense = async (expenseId) => {
        try {
          const res = await gasCall('deleteExpense', expenseId);
          if (res.success) { showToast(expenseId + ' deleted', 'ok'); refreshExpenses(); }
          else showToast(res.error || 'Could not delete expense.', 'err');
        } catch (err) { showToast(err.message || 'Could not delete expense.', 'err'); }
      };

      const titles = {
        dashboard: ['Dashboard', "Today's revenue and spending at a glance"],
        invoices: ['Invoices', 'Search, filter, and manage every invoice'],
        expenses: ['Expenses', 'Log and track your business spending'],
        new: ['New invoice', 'Create an invoice — saving it adds a row to your sheet'],
        settings: ['Settings', 'Your business profile, currency and numbering']
      };
      const pair = titles[page];

      return (
        <div className="app-shell">
          <aside className="sidebar">
            <div className="brand">
              <span className="brand-mark">Ledger</span>
            </div>
            <div className="brand-sub" style={{ padding: '0 8px', marginBottom: 12, marginTop: -12 }}>Invoicing</div>

            <button className={"nav-item" + (page === 'dashboard' ? ' active' : '')} onClick={() => setPage('dashboard')}>
              <IconDash /><span className="nav-label">Dashboard</span>
            </button>
            <button className={"nav-item" + (page === 'invoices' ? ' active' : '')} onClick={() => setPage('invoices')}>
              <IconList /><span className="nav-label">Invoices</span>
            </button>
            <button className={"nav-item" + (page === 'expenses' ? ' active' : '')} onClick={() => setPage('expenses')}>
              <IconReceipt /><span className="nav-label">Expenses</span>
            </button>
            <button className={"nav-item" + (page === 'new' ? ' active' : '')} onClick={() => setPage('new')}>
              <IconPlus /><span className="nav-label">New invoice</span>
            </button>
            <button className={"nav-item" + (page === 'settings' ? ' active' : '')} onClick={() => setPage('settings')}>
              <IconSettings /><span className="nav-label">Settings</span>
            </button>

            <div className="sidebar-footer">Backed by your Google Sheet.<br />Every save writes a new row.</div>
          </aside>

          <main className="main">
            <header className="topbar">
              <div><div className="page-title">{pair[0]}</div><div className="page-sub">{pair[1]}</div></div>
              {page !== 'new' && page !== 'settings' && <button className="btn btn-teal" onClick={() => setPage('new')}><IconPlus /> New invoice</button>}
            </header>

            {previewMode && (
              <div className="preview-banner">
                <strong>Preview mode.</strong> You are viewing this page directly, not through the deployed Google Apps Script web app — so data is mocked and <em>nothing is saved</em> to your sheet. Deploy the script (Deploy → New deployment → Web app) and open the URL it gives you.
              </div>
            )}

            <div className="content">
              {page === 'dashboard' && <Dashboard invoices={invoices} loading={loading} onNavigate={setPage} dataInfo={dataInfo} />}
              {page === 'invoices' && <InvoicesList invoices={invoices} loading={loading} onMarkPaid={handleMarkPaid} onNew={() => setPage('new')} showToast={showToast} dataInfo={dataInfo} />}
              {page === 'expenses' && <ExpensesPage expenses={expenses} loading={expensesLoading} onAdd={handleAddExpense} onDelete={handleDeleteExpense} showToast={showToast} />}
              {page === 'new' && <InvoiceForm onSaved={() => { refresh(); setPage('invoices'); }} showToast={showToast} />}
              {page === 'settings' && <SettingsForm settings={settings} onSave={(s) => { setSettings(s); refresh(); }} showToast={showToast} />}
            </div>
          </main>

          {toast && <div className={"toast " + (toast.kind === 'err' ? 'err' : 'ok')}>{toast.msg}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    if (window.__clearBootTimer) window.__clearBootTimer();
  </script>
</body>

</html>
